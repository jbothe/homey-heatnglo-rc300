name: Test
on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  main:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No install step: the suite runs on the built-in `node:test`, and the
      # app has no dependencies, so there is nothing to fetch or cache.
      #
      # Coverage is reported, not enforced: a threshold here would also cover
      # any module a future test file happens to load, and fail the moment one
      # arrives partly covered. The figures are in this job's log.
      - name: Run tests
        run: npm run test:coverage
