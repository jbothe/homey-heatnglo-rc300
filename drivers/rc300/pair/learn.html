<style>
    .rc300-learn {
        /* Homey absolutely positions .hy-view to fill the pane, so this needs a
           height of its own before justify-content can centre anything. */
        min-height: 100%;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: var(--homey-su-4) var(--homey-su-3);
    }

    .rc300-flame {
        width: 96px;
        height: 96px;
        margin-bottom: 24px;
    }

    .rc300-flame path {
        fill: #EF7024;
    }

    .rc300-learn.is-listening .rc300-flame {
        animation: rc300-pulse 1.4s ease-in-out infinite;
    }

    @keyframes rc300-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%      { opacity: 0.55; transform: scale(0.94); }
    }

    .rc300-message {
        font-size: var(--homey-font-size-default);
        font-weight: var(--homey-font-weight-medium);
        color: var(--homey-color-text);
        margin: 0 0 var(--homey-su-1);
    }

    .rc300-hint {
        font-size: var(--homey-font-size-small);
        color: var(--homey-color-text-light);
        margin: 0;
        max-width: 320px;
    }

    .rc300-status {
        font-size: var(--homey-font-size-small);
        color: var(--homey-color-text-light);
        opacity: 0.7;
        margin: var(--homey-su-2) 0 0;
        min-height: 20px;
    }
</style>

<div class="rc300-learn" id="container">
    <svg class="rc300-flame" viewBox="0 0 960 960" xmlns="http://www.w3.org/2000/svg">
        <path d="M500,80
                 C560,180 680,260 650,400
                 C630,340 580,360 590,440
                 C600,500 660,520 660,620
                 C660,740 560,820 460,820
                 C360,820 280,740 280,620
                 C280,540 320,500 320,440
                 C320,380 280,360 300,300
                 C260,380 240,460 260,540
                 C220,460 220,360 280,280
                 C320,220 380,180 420,140
                 C440,180 440,220 460,240
                 C470,180 480,120 500,80
                 Z"/>
    </svg>

    <p class="rc300-message" id="message"></p>
    <p class="rc300-hint" id="hint"></p>
    <p class="rc300-status" id="status"></p>

    <button class="homey-button-primary-full" id="retry" style="margin-top: 24px; display: none;"></button>
</div>

<script type="application/javascript">
    var container = document.getElementById('container');
    var message = document.getElementById('message');
    var hint = document.getElementById('hint');
    var status = document.getElementById('status');
    var retry = document.getElementById('retry');

    var listening = false;

    Homey.setTitle(Homey.__('pair.title'));
    retry.textContent = Homey.__('pair.retry');

    function setState(state, messageText, hintText) {
        container.className = 'rc300-learn is-' + state;
        message.textContent = messageText;
        hint.textContent = hintText || '';

        // Set visibility inline. Homey's own stylesheet matches this button with
        // [class*='homey-button'][class*='-full'], which is specificity (0,2,0)
        // and beats any single class of ours no matter the source order — only
        // an inline style reliably wins.
        var showRetry = (state === 'error');
        retry.style.display = showRetry ? 'inline-grid' : 'none';
        retry.disabled = !showRetry;
        // Homey styles disabled buttons via [disabled='disabled'] and .is-disabled.
        // A JS-set .disabled reflects as disabled="" and matches neither, so the
        // class is what actually greys the button out.
        retry.classList.toggle('is-disabled', !showRetry);
    }

    // Live feedback from the driver about what Homey is actually receiving,
    // so a silent failure is distinguishable from an unrecognised remote.
    Homey.on('rx', function (data) {
        if (!data || !listening) return;
        status.textContent = Homey.__('pair.heard') + ' ' + data.heard +
            (data.command ? ' (' + data.command + ')' : '');
    });

    function learn() {
        listening = true;
        status.textContent = '';
        setState('listening', Homey.__('pair.listening'), Homey.__('pair.listening_hint'));

        Homey.emit('learn')
            .then(function () {
                listening = false;
                setState('found', Homey.__('pair.found'), '');
                // Brief pause so the success state is actually readable.
                setTimeout(function () {
                    Homey.showView('list_devices');
                }, 900);
            })
            .catch(function (err) {
                listening = false;
                setState('error', Homey.__('pair.failed'), (err && err.message) || '');
            });
    }

    retry.addEventListener('click', function () {
        if (listening) return;
        learn();
    });

    learn();
</script>
